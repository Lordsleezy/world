name: convex-export

on:
  schedule:
    - cron: "30 11 * * 0"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Export Convex snapshot
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "No CONVEX_DEPLOY_KEY yet. Skipping."
            exit 0
          fi
          npm install
          npx convex export --path openbox-backup.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openbox-backup
          path: openbox-backup.zip
          if-no-files-found: ignore
